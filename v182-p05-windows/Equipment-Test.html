<title>裝備操作測試</title>
<h1>裝備操作測試</h1>
<p>點「開始遊戲」，選擇裝備測試角色後進入村莊。背包會自動開啟，內有匕首、皮夾克和精靈匕首。</p>
<p>點物品裝備，再點一次卸下。金框表示已裝備。點另一把武器可更換。重新登入同一角色即可查看保存的結果。</p>
<p>測試角色使用獨立存檔。裝備名稱參考 2003 年舊版攻略，這個入口只測試裝卸與存檔。</p>
<p><a href="Start.html?equipmentTest=1">進入裝備測試</a></p>
