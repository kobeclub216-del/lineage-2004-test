<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v0.03-C 騎士動畫資源檢查</title><style>body{background:#171d19;color:#eee1bf;font-family:system-ui;margin:20px}h1{font-size:22px}p{line-height:1.6}button{padding:10px;background:#4c604d;color:white;border:1px solid #a89c6c;border-radius:6px}table{border-collapse:collapse;width:100%;max-width:850px}td,th{border:1px solid #657064;padding:8px;text-align:left}img{max-width:75px;max-height:85px;image-rendering:pixelated}small{color:#b8b9aa}.ok{color:#8fe3a2}.fail{color:#f3a39a}</style></head><body><h1>v0.03-C 騎士動畫資源檢查</h1><p>預設檢查本專案本地素材；勾選參考預覽後，瀏覽器會直接向公開參考專案載入圖片供視覺比對，不會複製到本專案。參考圖片的使用權利仍屬原權利人。</p><p><label><input id="reference" type="checkbox"> 使用參考網站圖片預覽（僅在瀏覽器顯示）</label> <button id="run">重新檢查 8 方向 × 3 動作</button></p><p id="summary" aria-live="polite"></p><table><thead><tr><th>方向</th><th>站立</th><th>行走</th><th>攻擊</th></tr></thead><tbody id="body"></tbody></table><p><small>資料夾順序僅為候選對應，實際朝向仍需對照圖片核實。參考資料不代表授權。</small></p><script>
const folders=['男騎士','男騎士2','男騎士F','男騎士d3','男騎士d4','男騎士d5','男騎士d6','男騎士d7'];
const actions=['idle','walk','attack'],labels=['站立','行走','攻擊'];
const root=document.getElementById('body'),summary=document.getElementById('summary');
function check(url){return new Promise(resolve=>{let img=new Image();img.onload=()=>resolve({ok:true,img});img.onerror=()=>resolve({ok:false});img.src=url})}
async function run(){root.replaceChildren();summary.textContent='檢查中…';let good=0,total=0;const base=document.getElementById('reference').checked?'https://raw.githubusercontent.com/shines871/idle-lineage-class/main/assets/classanim':'assets/classanim';for(let d=0;d<8;d++){const tr=document.createElement('tr'),head=document.createElement('th');head.textContent=d+' / '+folders[d];tr.append(head);for(let a=0;a<3;a++){let td=document.createElement('td'),url=base+'/'+encodeURIComponent(folders[d])+'/sword1_'+actions[a]+'_0.png';let r=await check(url);total++;if(r.ok){good++;td.className='ok';td.textContent='存在 ';td.append(r.img)}else{td.className='fail';td.textContent='缺少'}tr.append(td)}root.append(tr)}summary.textContent='已找到 '+good+' / '+total+' 個動作起始影格。';}
document.getElementById('run').onclick=run;document.getElementById('reference').onchange=run;run();
</script></body></html>
