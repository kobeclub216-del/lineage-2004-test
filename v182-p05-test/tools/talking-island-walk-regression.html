<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>說話之島｜行走與遮擋回歸測試</title><style>body{font:15px system-ui;background:#171717;color:#eee;margin:24px}li{margin:8px} .ok{color:#a9e6b2}.bad{color:#ff9999}</style></head><body><h2>說話之島｜行走與遮擋回歸測試</h2><p>使用程式產生的測試物件（不是遊戲圖片）驗證移動、碰撞與繪製順序，不代表原版場景完成。</p><ol id="results"></ol><canvas id="test" width="800" height="600" hidden></canvas>
<script src="../assets/maps/talking-island-renderer.js"></script><script src="../assets/maps/talking-island-movement.js"></script><script>
(()=>{
'use strict';
const results=document.getElementById('results');let pass=0,fail=0;
function test(name,fn){try{if(fn()!==true)throw Error('Assertion failed');const li=document.createElement('li');li.className='ok';li.textContent='通過：'+name;results.append(li);pass++}catch(e){const li=document.createElement('li');li.className='bad';li.textContent='失敗：'+name+' — '+e.message;results.append(li);fail++}}
const calls=[],ctx={clearRect(){},fillRect(){},drawImage(image){calls.push(image.id)},set fillStyle(v){}},canvas={width:800,height:600,getContext(){return ctx}};
const r=new TalkingIslandLayerRenderer(canvas),bounds={minX:0,minY:0,maxX:8,maxY:8},img=id=>({id,complete:true,naturalWidth:48,naturalHeight:72});
r.setScene({bounds,layers:[{id:'ground',depth:0,images:[{image:img('ground'),x:0,y:0,width:500,height:300}]},{id:'buildings',depth:1,images:[{image:img('building'),x:3,y:3,width:100,height:120,footY:6}]}]});
r.setCollision({bounds,blockedCells:[[2,2],[2,3],[2,4],[3,3]]});
const m=new TalkingIslandMovementController(r);
test('障礙格不可通行',()=>!r.canWalk(2,2)&&r.canWalk(1,1));
test('無效出生點被拒絕',()=>{try{m.spawn(2,2);return false}catch(e){return e instanceof RangeError}});
test('合法出生點',()=>m.spawn(1,1).x===1);
test('自動繞開建築佔地',()=>{if(!m.moveTo(5,5))return false;let n=0;while(m.step()&&n++<50){if(!r.canWalk(m.position.x,m.position.y))return false}return m.position.x===5&&m.position.y===5});
test('新目的地替換舊路線',()=>m.moveTo(7,7)&&m.route.length>0&&m.moveTo(1,1)&&m.route.length>0);
test('點擊不可行走位置清除舊路線',()=>!m.moveTo(2,2)&&m.route.length===0);
test('畫面與世界座標互轉',()=>{const p=r.project(4,1);const c=m.pick(p.x,p.y,0,0);return c&&c.x===4&&c.y===1});
test('人物在建築前方時覆蓋建築',()=>{calls.length=0;r.render({player:{image:img('actor'),x:5,y:4,width:48,height:72,depth:1,footY:9}});return calls.join(',')==='ground,building,actor'});
test('人物在建築後方時被建築覆蓋',()=>{calls.length=0;r.render({player:{image:img('actor'),x:1,y:1,width:48,height:72,depth:1,footY:2}});return calls.join(',')==='ground,actor,building'});
test('鏡頭跟隨位置有效',()=>{const c=m.camera();return Number.isFinite(c.cameraX)&&Number.isFinite(c.cameraY)});
test('停止移動清空路徑',()=>m.moveTo(7,7)&&(m.cancel(),m.route.length===0));
const p=document.createElement('p');p.textContent='結果：'+pass+' 通過，'+fail+' 失敗';p.className=fail?'bad':'ok';results.after(p);
})();
</script></body></html>
