<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>說話之島｜行走與遮擋回歸測試</title><style>body{font:15px system-ui;background:#171717;color:#eee;margin:24px}li{margin:8px} .ok{color:#a9e6b2}.bad{color:#ff9999}</style></head><body><h2>說話之島｜行走與遮擋回歸測試</h2><p>使用程式產生的測試物件（不是遊戲圖片）驗證移動、碰撞與繪製順序，不代表原版場景完成。</p><ol id="results"></ol><canvas id="test" width="800" height="600" hidden></canvas>
<script src="../assets/maps/talking-island-renderer.js"></script><script src="../assets/maps/talking-island-movement.js"></script><script>
(()=>{
'use strict';
const results=document.getElementById('results');let pass=0,fail=0;
function test(name,fn){try{if(fn()!==true)throw Error('Assertion failed');const li=document.createElement('li');li.className='ok';li.textContent='通過：'+name;results.append(li);pass++}catch(e){const li=document.createElement('li');li.className='bad';li.textContent='失敗：'+name+' — '+e.message;results.append(li);fail++}}
const calls=[],ctx={clearRect(){},fillRect(){},drawImage(image,...args){calls.push({id:image.id,args})},set fillStyle(v){}},canvas={width:800,height:600,getContext(){return ctx}};
const r=new TalkingIslandLayerRenderer(canvas),bounds={minX:0,minY:0,maxX:8,maxY:8},img=id=>({id,complete:true,naturalWidth:48,naturalHeight:72});
r.setScene({bounds,layers:[{id:'ground',depth:0,images:[{image:img('ground'),x:0,y:0,width:500,height:300}]},{id:'buildings',depth:1,images:[{image:img('building'),x:3,y:3,width:100,height:120,footY:6}]}]});
r.setCollision({bounds,blockedCells:[[2,2],[2,3],[2,4],[3,3]]});
const m=new TalkingIslandMovementController(r);
test('障礙格不可通行',()=>!r.canWalk(2,2)&&r.canWalk(1,1));
test('無效出生點被拒絕',()=>{try{m.spawn(2,2);return false}catch(e){return e instanceof RangeError}});
test('合法出生點',()=>m.spawn(1,1).x===1);
test('自動繞開建築佔地',()=>{if(!m.moveTo(5,5))return false;let n=0;while(m.step()&&n++<50){if(!r.canWalk(m.position.x,m.position.y))return false}return m.position.x===5&&m.position.y===5});
test('八方向允許開放區域斜走',()=>{m.spawn(5,5);return m.moveTo(6,6)&&m.route.length===1&&m.route[0].x===6&&m.route[0].y===6});
test('斜走不得穿越障礙物角落',()=>{m.spawn(1,2);if(!m.moveTo(2,1))return false;return m.route.length>1&&!(m.route[0].x===2&&m.route[0].y===1)});
m.spawn(5,5);
test('人物移動面向與步伐同步',()=>{m.spawn(5,5);if(!m.moveTo(6,6)||!m.step())return false;const a=m.getAnimationState();return a.facing==='SE'&&!a.moving&&a.position.x===6&&a.position.y===6});
test('等角地圖斜向座標正確轉換畫面方向',()=>{m.spawn(5,5);if(!m.moveTo(6,5)||!m.step())return false;return m.getAnimationState().facing==='E'&&m.getAnimationState().screenFacing==='SE'});
test('八方向畫面面向對應正確',()=>{const expected={N:'NE',NE:'E',E:'SE',SE:'S',S:'SW',SW:'W',W:'NW',NW:'N'};return Object.entries(expected).every(([grid,screen])=>{m.facing=grid;return m.getScreenFacing()===screen})});
test('取消移動保留最後面向',()=>{m.spawn(5,5);if(!m.moveTo(6,5)||!m.step())return false;m.moveTo(7,7);m.cancel();const a=m.getAnimationState();return a.facing==='E'&&!a.moving});
m.spawn(5,5);
test('新目的地替換舊路線',()=>m.moveTo(7,7)&&m.route.length>0&&m.moveTo(1,1)&&m.route.length>0);
test('點擊不可行走位置清除舊路線',()=>!m.moveTo(2,2)&&m.route.length===0);
test('畫面與世界座標互轉',()=>{const p=r.project(4,1);const c=m.pick(p.x,p.y,0,0);return c&&c.x===4&&c.y===1});
test('人物在建築前方時覆蓋建築',()=>{calls.length=0;r.render({player:{image:img('actor'),x:5,y:4,width:48,height:72,depth:1,footY:9}});return calls.map(c=>c.id).join(',')==='ground,building,actor'});
test('人物在建築後方時被建築覆蓋',()=>{calls.length=0;r.render({player:{image:img('actor'),x:1,y:1,width:48,height:72,depth:1,footY:2}});return calls.map(c=>c.id).join(',')==='ground,actor,building'});
test('Sprite 圖集依來源矩形裁切',()=>{calls.length=0;r.render({player:{image:img('actor'),x:5,y:5,width:48,height:72,depth:1,sourceRect:{x:0,y:0,width:24,height:36}}});const actor=calls.find(c=>c.id==='actor');return !!actor&&actor.args.length===8&&actor.args[2]===24&&actor.args[3]===36});
test('超出圖片範圍的 Sprite 影格不繪製',()=>{calls.length=0;r.render({player:{image:img('actor'),x:5,y:5,width:48,height:72,depth:1,sourceRect:{x:40,y:0,width:24,height:36}}});return !calls.some(c=>c.id==='actor')});
test('每個畫面方向對應的圖集列均可裁切',()=>{
 const atlas={id:'atlas',complete:true,naturalWidth:192,naturalHeight:576};
 const directions=['N','NE','E','SE','S','SW','W','NW'];
 return directions.every((direction,row)=>{
  calls.length=0;
  r.render({player:{image:atlas,x:5,y:5,width:48,height:72,depth:1,
   sourceRect:{x:48,y:row*72,width:48,height:72}}});
  const drawn=calls.find(c=>c.id==='atlas');
  return drawn&&drawn.args.length===8&&drawn.args[0]===48&&drawn.args[1]===row*72;
 });
});
test('人物與建築同深度時依腳底位置排序',()=>{
 calls.length=0;
 r.render({player:{image:img('actor'),x:5,y:4,width:48,height:72,depth:1,footY:5}});
 return calls.map(c=>c.id).join(',')==='ground,actor,building';
});
test('移動途中再次指定目標後不沿用舊路徑',()=>{
 m.spawn(1,1);
 if(!m.moveTo(6,6)||!m.step())return false;
 const previousDestination=m.route[m.route.length-1];
 if(!previousDestination||!m.moveTo(0,0))return false;
 const next=m.getAnimationState();
 return next.destination.x===0&&next.destination.y===0&&next.remainingSteps>0;
});
test('不可行走點擊不會建立路徑',()=>{
 m.spawn(1,1);
 const blocked=r.project(2,2);
 return m.pick(blocked.x,blocked.y,0,0)===null&&!m.moveTo(2,2);
});
test('移動過程每一步均保持在合法格位',()=>{
 m.spawn(0,0);if(!m.moveTo(7,7))return false;
 let count=0;
 while(m.route.length&&count++<60){if(!m.step()||!r.canWalk(m.position.x,m.position.y))return false;}
 return count<60&&m.position.x===7&&m.position.y===7;
});
test('鏡頭跟隨位置有效',()=>{const c=m.camera();return Number.isFinite(c.cameraX)&&Number.isFinite(c.cameraY)});
test('停止移動清空路徑',()=>m.moveTo(7,7)&&(m.cancel(),m.route.length===0));
const p=document.createElement('p');p.textContent='結果：'+pass+' 通過，'+fail+' 失敗';p.className=fail?'bad':'ok';results.after(p);
})();
</script></body></html>
