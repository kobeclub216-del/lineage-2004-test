<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>說話之島｜地圖行走整合測試</title><style>body{background:#171717;color:#eee;font:15px system-ui;margin:16px}main{max-width:1050px;margin:auto}canvas{max-width:100%;border:1px solid #555;touch-action:none}input,button{font:inherit;margin:5px}p{line-height:1.6;color:#d3d3d3}#status{white-space:pre-wrap}</style></head><body><main><h2>說話之島｜場景行走整合測試</h2><p>這是獨立測試頁，不是已還原的 2004 年村莊。僅載入使用者本機提供、具使用權的場景及人物圖片；不產生任何假冒原版的地圖。</p><label>場景圖片 <input id="ground" type="file" accept="image/png,image/jpeg,image/webp"></label><label>人物圖片 <input id="actor" type="file" accept="image/png,image/jpeg,image/webp"></label><label>碰撞 JSON <input id="collision" type="file" accept=".json,application/json"></label><label>前景遮擋圖片（可選） <input id="foreground" type="file" accept="image/png,image/jpeg,image/webp"></label><label>建築物圖片（可選） <input id="building" type="file" accept="image/png,image/jpeg,image/webp"></label><label>建築物格位 X <input id="buildingX" type="number" step="1" value="0" style="width:75px"></label><label>Y <input id="buildingY" type="number" step="1" value="0" style="width:75px"></label><label>建築佔地寬（格） <input id="buildingW" type="number" min="1" max="100" step="1" value="1" style="width:75px"></label><label>高（格） <input id="buildingH" type="number" min="1" max="100" step="1" value="1" style="width:75px"></label><button id="start">開始測試</button><button id="cancel">停止行走</button><label><input id="debug" type="checkbox">顯示碰撞格與座標（測試用）</label><canvas id="c" width="960" height="600"></canvas><p id="status">請先選擇場景、人物及碰撞資料。資料不會上傳。</p><p>碰撞 JSON 格式：<code>{"bounds":{"minX":0,"minY":0,"maxX":10,"maxY":10},"blockedCells":[[1,2]],"spawn":{"x":2,"y":2},"imagePlacement":{"x":0,"y":0,"width":560,"height":280}}</code>。座標必須自行核對；本工具不會推定原版世界座標。</p></main>
<script src="../assets/maps/talking-island-renderer.js"></script><script src="../assets/maps/talking-island-movement.js"></script><script>
(()=>{'use strict';
const canvas=document.getElementById('c'),status=document.getElementById('status'),renderer=new TalkingIslandLayerRenderer(canvas),movement=new TalkingIslandMovementController(renderer);
let actor=null,active=false,frame=0,loadGeneration=0;
const readImage=async id=>{const f=document.getElementById(id).files[0];if(!f||!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>25*1024*1024)throw Error('請提供 25MB 以下的有效圖片：'+id);const url=URL.createObjectURL(f);try{const img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});return img}finally{URL.revokeObjectURL(url)}};
function render(){if(!active)return;const p=movement.position,c=movement.camera();renderer.render({cameraX:c.cameraX,cameraY:c.cameraY,player:{image:actor,x:p.x,y:p.y,width:48,height:72,depth:1,footY:p.x+p.y}});
 if(document.getElementById('debug').checked){
  const ctx=canvas.getContext('2d'),b=renderer.collision.bounds;
  const minX=Math.max(b.minX,p.x-15),maxX=Math.min(b.maxX,p.x+16),minY=Math.max(b.minY,p.y-15),maxY=Math.min(b.maxY,p.y+16);
  ctx.save();ctx.lineWidth=1;ctx.font='10px monospace';
  for(let y=minY;y<maxY;y++)for(let x=minX;x<maxX;x++){
   const point=renderer.project(x,y,c.cameraX,c.cameraY),tw=renderer.tileWidth,th=renderer.tileHeight;
   ctx.beginPath();ctx.moveTo(point.x,point.y-th/2);ctx.lineTo(point.x+tw/2,point.y);ctx.lineTo(point.x,point.y+th/2);ctx.lineTo(point.x-tw/2,point.y);ctx.closePath();
   const blocked=!renderer.canWalk(x,y);ctx.fillStyle=blocked?'rgba(230,60,60,.35)':'rgba(60,200,120,.08)';ctx.fill();ctx.strokeStyle=blocked?'#ff7373':'rgba(120,255,170,.45)';ctx.stroke();
  }
  const here=renderer.project(p.x,p.y,c.cameraX,c.cameraY);ctx.fillStyle='#fff';ctx.fillText('('+p.x+','+p.y+')',here.x+10,here.y+12);ctx.restore();
 }
 frame=requestAnimationFrame(render)}
document.getElementById('start').addEventListener('click',async()=>{
 const generation=++loadGeneration;
 active=false;cancelAnimationFrame(frame);status.textContent='正在讀取本機測試素材…';try{
 const f=document.getElementById('collision').files[0];if(!f||f.size>1024*1024)throw Error('請選擇 1MB 以下的碰撞 JSON');
 const data=JSON.parse(await f.text()),b=data.bounds;
 if(!b||![b.minX,b.minY,b.maxX,b.maxY].every(Number.isInteger)||b.minX>=b.maxX||b.minY>=b.maxY||!Array.isArray(data.blockedCells)||!data.spawn||!Number.isInteger(data.spawn.x)||!Number.isInteger(data.spawn.y))throw Error('碰撞或出生點格式無效');
 // Image placement is explicit and independent of the player's spawn.
 // Never silently treat a spawn point as the image's geographical anchor.
 const placement=data.imagePlacement;
 if(!placement||!Number.isInteger(placement.x)||!Number.isInteger(placement.y)||!Number.isFinite(placement.width)||!Number.isFinite(placement.height)||placement.width<=0||placement.height<=0)throw Error('碰撞 JSON 必須包含經人工設定的 imagePlacement {x,y,width,height}');
 if(placement.x<b.minX||placement.x>=b.maxX||placement.y<b.minY||placement.y>=b.maxY)throw Error('場景圖片錨點超出地圖範圍');
 const [ground,character]=await Promise.all([readImage('ground'),readImage('actor')]);
 if(!ground.naturalWidth||!ground.naturalHeight||!character.naturalWidth||!character.naturalHeight)throw Error('圖片沒有有效尺寸');
 if(generation!==loadGeneration)return;
 const foreground=document.getElementById('foreground').files.length?await readImage('foreground'):null;
 const building=document.getElementById('building').files.length?await readImage('building'):null;
 if(generation!==loadGeneration)return;
 const bx=Number(document.getElementById('buildingX').value),by=Number(document.getElementById('buildingY').value);
 if(building&&(!Number.isInteger(bx)||!Number.isInteger(by)||bx<b.minX||bx>=b.maxX||by<b.minY||by>=b.maxY))throw Error('建築物格位必須位於地圖範圍內');
 const bw=Number(document.getElementById('buildingW').value),bh=Number(document.getElementById('buildingH').value);
 if(building&&(!Number.isInteger(bw)||!Number.isInteger(bh)||bw<1||bh<1||bx+bw>b.maxX||by+bh>b.maxY))throw Error('建築佔地範圍超出地圖或尺寸無效');
 if(building&&data.spawn.x>=bx&&data.spawn.x<bx+bw&&data.spawn.y>=by&&data.spawn.y<by+bh)throw Error('人物出生點不能位於建築物佔地內');
 // Ground is drawn in screen space at the same isometric anchor as all other layers.
 // The reference scene has no automatic historical calibration.
 const layers=[{id:'local-ground',depth:0,images:[{image:ground,x:placement.x,y:placement.y,width:placement.width,height:placement.height,footY:-Infinity}]}];
 if(building)layers.push({id:'local-building',depth:1,images:[{image:building,x:bx,y:by,width:building.naturalWidth,height:building.naturalHeight,footY:bx+by+bw+bh-2}]});
 if(foreground)layers.push({id:'local-foreground',depth:2,images:[{image:foreground,x:placement.x,y:placement.y,width:placement.width,height:placement.height,footY:Infinity}]});
 if(generation!==loadGeneration)return;
 renderer.setScene({bounds:b,layers});
 const blocked=data.blockedCells.slice();
 if(blocked.length>100000)throw Error('碰撞格數量過多');
 if(!blocked.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isInteger)))throw Error('碰撞格資料無效');
 if(building){for(let y=by;y<by+bh;y++)for(let x=bx;x<bx+bw;x++)blocked.push([x,y])}
 renderer.setCollision({bounds:b,blockedCells:blocked});movement.spawn(data.spawn.x,data.spawn.y);actor=character;active=true;render();status.textContent='已載入本機測試素材'+(building?'、建築物深度排序':'')+(foreground?'與固定前景遮擋圖':'')+'。點擊畫面移動；不代表原版地圖座標已驗證。';
 }catch(e){if(generation===loadGeneration)status.textContent='無法啟動：'+e.message}
});
// Pointer events work with mouse, touch and pen. Ignore multi-touch gestures.
let pointerStart=null;
canvas.addEventListener('pointerdown',e=>{
 if(!active||!e.isPrimary)return;
 pointerStart={id:e.pointerId,x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointercancel',()=>{pointerStart=null});
canvas.addEventListener('pointerup',e=>{
 if(!active||!pointerStart||pointerStart.id!==e.pointerId)return;
 const start=pointerStart;pointerStart=null;
 if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>12)return;
 const rect=canvas.getBoundingClientRect(),c=movement.camera();
 const target=movement.pick((e.clientX-rect.left)*canvas.width/rect.width,(e.clientY-rect.top)*canvas.height/rect.height,c.cameraX,c.cameraY);
 if(!target){movement.cancel();status.textContent='點擊位置不是可行走格，已取消移動';return}
 status.textContent=movement.moveTo(target.x,target.y)?'移動至 '+target.x+','+target.y:'無法抵達目標格';
});
document.getElementById('cancel').addEventListener('click',()=>movement.cancel());
let last=0;function tick(t){if(active&&t-last>=150){movement.step();last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script></body></html>
