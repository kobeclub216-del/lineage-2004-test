name: Asset pipeline tests
on:
  push:
    branches: [lineage-182-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/test-asset-pipeline.py -v
