name: Local character animation tests
on:
  push:
    branches: [lineage-182-dev]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/test-local-character-sprites.cjs
