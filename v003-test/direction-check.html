<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>騎士方向校正 v0.03-L</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#18221b;color:#f0dfb3;font-family:system-ui}h1{font-size:20px}p{font-size:14px;line-height:1.6}button,select{background:#344636;color:#fff0c4;border:1px solid #998658;padding:9px;font-size:16px;border-radius:5px}table{border-collapse:collapse;width:100%;min-width:620px}td,th{border:1px solid #66715b;padding:5px;text-align:center;font-size:13px}td{height:100px}.wrap{overflow-x:auto}.frame{height:70px;width:90px;object-fit:contain;image-rendering:pixelated}.flip{transform:scaleX(-1)}.bad{color:#ffa0a0}small{color:#c4bda5}label{display:inline-block;margin:5px}#out{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>騎士八方向校正表｜v0.03-L</h1><p>每一列代表一個「來源資料夾」，並非已確認的朝向。請對照站立、走路、攻擊的角色面向，特別注意劍揮出的方向是否與走路一致。此頁不會修改正式遊戲數值。</p><p><label>動作影格 <select id="frame"><option value="0">第 1 幀</option><option value="1">第 2 幀</option><option value="2">第 3 幀</option><option value="3">第 4 幀</option></select></label><label><input type="checkbox" id="flip"> 全部水平鏡像比較</label><button id="reload">重新讀取</button></p><p id="status">準備中</p><div class="wrap"><table><thead><tr><th>資料夾</th><th>站立 idle</th><th>行走 walk</th><th>攻擊 attack</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>圖片直接從參考網站讀取，僅供視覺檢查；圖片權利仍屬原權利人。若圖片無法顯示，請截圖錯誤數字。</small></p><script>
const names=['男騎士','男騎士2','男騎士F','男騎士d3','男騎士d4','男騎士d5','男騎士d6','男騎士d7'];
const base='https://shines871.github.io/idle-lineage-class/assets/classanim/';
const backup='https://raw.githubusercontent.com/shines871/idle-lineage-class/main/assets/classanim/';
const rows=document.getElementById('rows'),status=document.getElementById('status');
function render(){rows.replaceChildren();let ok=0,fail=0,done=0;status.textContent='圖片載入中…';for(const folder of names){const tr=document.createElement('tr');const th=document.createElement('th');th.textContent=folder;tr.append(th);for(const action of ['idle','walk','attack']){const td=document.createElement('td'),img=document.createElement('img');img.className='frame'+(document.getElementById('flip').checked?' flip':'');img.alt=folder+' '+action;const frame=action==='idle'||action==='walk'||action==='attack'?document.getElementById('frame').value:'0';const relative=encodeURIComponent(folder)+'/sword1_'+action+'_'+frame+'.png';let retry=false;img.onload=()=>{ok++;done++;status.textContent='已載入 '+ok+'｜失敗 '+fail+'｜總計 '+done+'/24'};img.onerror=()=>{if(!retry){retry=true;img.src=backup+relative}else{fail++;done++;td.textContent='圖片缺失';td.className='bad';status.textContent='已載入 '+ok+'｜失敗 '+fail+'｜總計 '+done+'/24'}};img.src=base+relative;td.append(img);tr.append(td)}rows.append(tr)}}
document.getElementById('reload').onclick=render;document.getElementById('frame').onchange=render;document.getElementById('flip').onchange=render;render();
</script></body></html>
